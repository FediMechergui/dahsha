# Refreshes the catalogue from YouTube, exports static data, redeploys the site to Vercel and
# stores the metadata cache as a release asset so the next run is incremental.
name: Refresh catalogue & deploy

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      full:
        description: 'Full rebuild (re-fetch every playlist)'
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_PRODUCT: dahsha
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix server && npm ci --prefix client
      - name: Restore data snapshot
        run: node scripts/snapshot.js restore
      - name: Refresh from YouTube
        run: node server/src/cli.js ${{ inputs.full && 'rebuild' || 'refresh' }}
      - name: Export static data
        run: node server/src/export.js
      - name: Refresh shared providers for both libraries
        run: node scripts/refresh-providers.js --product both --pages 60 --matches 100
      # "vercel build" runs the buildCommand from vercel.json (static build with the exported data);
      # the prebuilt deploy then uploads the result, including the data files that git ignores.
      - name: Build & deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          node scripts/prepare-deployment.js dahsha
          # --archive=tgz: one upload instead of ~13k files (the free plan caps file uploads at 5000/day)
          vercel deploy --prebuilt --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
      - name: Build site (no Vercel token configured)
        if: env.VERCEL_TOKEN == ''
        run: node scripts/build-static.js
      - name: Publish Flixer independently
        if: env.VERCEL_TOKEN != '' && vars.FLIXER_VERCEL_PROJECT_ID != ''
        env:
          APP_PRODUCT: flixer
          VERCEL_PROJECT_ID: ${{ vars.FLIXER_VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --local-config vercel.flixer.json --token "$VERCEL_TOKEN"
          node scripts/prepare-deployment.js flixer
          vercel deploy --prebuilt --prod --yes --archive=tgz --local-config vercel.flixer.json --token "$VERCEL_TOKEN"
      - name: Save data snapshot
        if: always()
        run: node scripts/snapshot.js save
