# Builds the Android APK (Capacitor) and attaches it to a GitHub Release.
# Trigger: push a tag like v1.2.0, or run manually. Signing uses the keystore stored in secrets
# (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD);
# without them an unsigned release APK is produced.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        product: [dahsha, flixer]
    env:
      APP_PRODUCT: ${{ matrix.product }}
      VITE_PRODUCT: ${{ matrix.product }}
      DATA_BASE: ${{ matrix.product == 'dahsha' && (vars.DATA_BASE || 'https://dahsha.vercel.app') || (vars.FLIXER_DATA_BASE || 'https://flixer-eight.vercel.app') }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      APP_VERSION_NAME: ${{ inputs.tag || github.ref_name }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The ubuntu runner ships the Android SDK (ANDROID_HOME is preset); accept its licences.
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Install
        run: npm ci --prefix client && npm ci --prefix mobile
      - name: Build web (static, pointing at the hosted data)
        run: node scripts/build-static.js --mobile --out ../mobile/www --data-base "$DATA_BASE"
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=../../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build release APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          f=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" "out/${{ matrix.product }}-${{ inputs.tag || github.ref_name }}.apk"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Dahsha and Flixer ${{ inputs.tag || github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
