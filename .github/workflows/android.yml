# Builds the Android APK (Capacitor) and attaches it to a GitHub Release.
# Trigger: push a tag like dahsha-v1.7.0 (or v1.7.0), or run manually. The APK carries the client
# code only; it reads the catalogue and /api from DATA_BASE at runtime, so data updates need no new
# APK while client code changes do. Signing uses the keystore stored in secrets
# (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD);
# without them an unsigned release APK is produced.
name: Android release

on:
  push:
    tags: ['v*', 'dahsha-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. dahsha-v1.7.0)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        product: [dahsha]
    env:
      APP_PRODUCT: ${{ matrix.product }}
      VITE_PRODUCT: ${{ matrix.product }}
      DATA_BASE: ${{ vars.DATA_BASE || 'https://dahsha.netlify.app' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      APP_VERSION_NAME: ${{ inputs.tag || github.ref_name }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The ubuntu runner ships the Android SDK (ANDROID_HOME is preset); accept its licences.
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Install
        run: npm ci --prefix server && npm ci --prefix client && npm ci --prefix mobile
      - name: Test
        run: npm test
      - name: Set increasing Android version code
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build web (static, pointing at the hosted data)
        run: node scripts/product.js "$APP_PRODUCT" mobile-web --data-base "$DATA_BASE"
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=../../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build release APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          f=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" "out/$APP_PRODUCT-$RELEASE_TAG.apk"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Dahsha ${{ inputs.tag || github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
