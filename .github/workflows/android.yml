# Builds the Android APK (Capacitor) and attaches it to a GitHub Release.
# Trigger: push a tag like v1.2.0, or run manually. Signing uses the keystore stored in secrets
# (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD);
# without them an unsigned release APK is produced.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_BASE: ${{ vars.DATA_BASE || 'https://dahsha.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install
        run: npm install --prefix client && npm install --prefix mobile
      - name: Build web (static, pointing at the hosted data)
        run: node scripts/build-static.js --mobile --out ../mobile/www --data-base "$DATA_BASE"
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        working-directory: mobile
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=../../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build release APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          f=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" "out/dahsha-${{ inputs.tag || github.ref_name }}.apk"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Dahsha ${{ inputs.tag || github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
