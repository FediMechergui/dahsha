# GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity, and the data workflows only upload release assets (no pushes). Once a month this job
# re-enables the scheduled workflows and pushes an empty commit to the dedicated "keepalive" branch.
# vercel.json disables Vercel deployments for that branch, and pushes made with GITHUB_TOKEN do not
# trigger other workflows.
name: Keep schedules alive

on:
  schedule:
    - cron: '29 5 1 * *'   # 05:29 UTC on the 1st of every month
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Re-enable the scheduled workflows
        run: |
          for workflow in refresh.yml poll.yml keepalive.yml; do
            gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY" || echo "::warning::could not enable $workflow"
          done
      - name: Push an empty commit to the keepalive branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B keepalive
          git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin keepalive
