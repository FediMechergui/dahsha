# GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity, and the data workflows only upload release assets (no pushes). Once a month this job
# re-enables the scheduled workflows and pushes an empty commit to the dedicated "keepalive" branch.
# vercel.json disables Vercel deployments for that branch, and pushes made with GITHUB_TOKEN do not
# trigger other workflows.
#
# Twice a day it also checks that the live site is being updated: it fails (and GitHub emails the
# failure, which a disabled or failing refresh workflow cannot do for itself) when
# the live runtime status cannot be read or has not been published for six hours.
# Code deployment timestamps are independent of catalogue freshness.
name: Keep schedules alive

on:
  schedule:
    - cron: '29 5 1 * *'     # 05:29 UTC on the 1st of every month: re-enable + keepalive push
    - cron: '41 8,20 * * *'  # 08:41 and 20:41 UTC: is the live catalogue fresh?
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://dahsha.netlify.app
      MAX_AGE_HOURS: '6'
    steps:
      - name: Check that the live catalogue is fresh
        run: |
          status_file="$RUNNER_TEMP/status.json"
          url="$SITE_URL/api/catalogue?part=status&ts=$(date +%s)"
          if ! curl -fsSL --retry 3 --retry-delay 30 --retry-all-errors --max-time 30 -H 'cache-control: no-cache' -o "$status_file" "$url"; then
            echo "::error title=Live catalogue unreachable::Could not read $SITE_URL/api/catalogue?part=status."
            printf '### Live catalogue unreachable\n\n`%s/api/catalogue?part=status` could not be read.\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          generated=$(jq -r '.generatedAt // empty' "$status_file" 2>/dev/null || true)
          if [ -z "$generated" ] || ! generated_s=$(date -u -d "$generated" +%s 2>/dev/null); then
            echo "::error title=Live catalogue has no update time::Runtime status has no readable generatedAt."
            exit 1
          fi
          now_s=$(date -u +%s)
          age_min=$(( (now_s - generated_s) / 60 ))
          age="$(( age_min / 60 )) h $(( age_min % 60 )) min"
          printf '### Live catalogue freshness\n\n- Runtime generatedAt: %s (%s ago)\n- limit: %s hours\n- Data publication is independent of hosting deployments.\n' "$generated" "$age" "$MAX_AGE_HOURS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(( now_s - generated_s ))" -gt "$(( MAX_AGE_HOURS * 3600 ))" ]; then
            echo "::error title=Live catalogue is stale::$SITE_URL was last updated $age ago ($generated), more than $MAX_AGE_HOURS hours. Check the documentary refresh and YouTube poll workflows."
            exit 1
          fi
          echo "Live catalogue updated $age ago ($generated)."

  keepalive:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '29 5 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Re-enable the scheduled workflows
        run: |
          for workflow in refresh.yml poll.yml keepalive.yml; do
            gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY" || echo "::warning::could not enable $workflow"
          done
      - name: Push an empty commit to the keepalive branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B keepalive
          git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin keepalive
