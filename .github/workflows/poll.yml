# Fast YouTube updates publish immutable data to GitHub every 30 minutes. The
# existing Netlify backend reads them without deploying website or function code.
name: Poll YouTube feeds

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Override the regression check; runtime and snapshot shrink checks still apply'
        type: boolean
        default: false
      allow_snapshot_shrink:
        description: 'Save the snapshot even if a cache count drops beyond SHRINK_LIMITS'
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_PRODUCT: dahsha
      GH_TOKEN: ${{ github.token }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SKIP_PROVIDER_SYNC: '1'   # providers are scanned by refresh.yml only
      REGRESSION_FORCE: ${{ inputs.force && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix server && npm ci --prefix client
      - name: Test
        run: npm test
      - name: Restore data snapshot
        id: restore
        run: node scripts/snapshot.js restore
      - name: Record restored catalogue counts
        run: node scripts/check-regression.js record --out "$RUNNER_TEMP/restored-counts.json"
      - name: Apply reviewed documentary identities
        timeout-minutes: 2
        run: node scripts/apply-reviewed-identities.js --apply --report "$RUNNER_TEMP/dahsha-identities.json"
      - name: Apply reviewed documentary episode guides
        timeout-minutes: 2
        run: node scripts/apply-reviewed-guides.js --apply --report "$RUNNER_TEMP/dahsha-guides.json"
      - name: Poll YouTube RSS feeds
        run: |
          status=0
          node server/src/cli.js poll || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::error title=YouTube ingestion looks broken::Every channel feed returned zero videos. Nothing was deployed and the data snapshot was not saved."
            printf '### YouTube ingestion looks broken\n\nEvery channel feed returned zero videos (`cli.js poll` exited with code 3). Nothing was deployed and the data snapshot was left untouched.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Export static data
        run: node server/src/export.js
      - name: Regression check
        id: guard
        run: node scripts/check-regression.js --restored "$RUNNER_TEMP/restored-counts.json" --write-baseline
      - name: Publish live catalogue data
        run: node scripts/publish-runtime.js
      # The `force` input does not reach this step: snapshot.js keeps its own cache shrink checks
      # unless allow_snapshot_shrink is set.
      - name: Save data snapshot
        if: always() && steps.restore.outcome == 'success' && steps.guard.outcome == 'success'
        run: node scripts/snapshot.js save ${{ inputs.allow_snapshot_shrink && '--allow-shrink' || '' }}
